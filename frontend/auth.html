<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Masuk / Daftar &mdash; Kreativa</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="/">Kreativa<span></span></a>
    <div class="links" id="navLinks"></div>
  </div>
</nav>

<div class="container" style="max-width:400px;margin-top:48px">
  <div class="form-card" style="box-shadow:var(--shadow-md)">
    <div class="row" style="gap:8px;margin-bottom:24px;justify-content:center;background:var(--border-light);padding:4px;border-radius:var(--radius-sm)">
      <button id="tabLogin" class="tab on" style="flex:1;border:0;padding:8px 0;margin:0" onclick="switchTab('login')">Masuk</button>
      <button id="tabRegister" class="tab" style="flex:1;border:0;padding:8px 0;margin:0" onclick="switchTab('register')">Daftar</button>
    </div>

    <!-- Form Login -->
    <form id="formLogin" onsubmit="handleLogin(event)">
      <div style="margin-bottom:14px">
        <label style="margin:0 0 6px">Alamat Email</label>
        <input type="email" id="loginEmail" placeholder="nama@email.com" required>
      </div>
      <div style="margin-bottom:20px">
        <label style="margin:0 0 6px">Kata Sandi</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" id="btnLogin" class="btn" style="width:100%">Masuk ke Akun</button>
    </form>

    <!-- Form Register -->
    <form id="formRegister" onsubmit="handleRegister(event)" style="display:none">
      <div style="margin-bottom:12px">
        <label style="margin:0 0 6px">Nama Lengkap</label>
        <input type="text" id="regName" placeholder="Nama lengkap kamu" required>
      </div>
      <div style="margin-bottom:12px">
        <label style="margin:0 0 6px">Alamat Email</label>
        <input type="email" id="regEmail" placeholder="nama@email.com" required>
      </div>
      <div style="margin-bottom:12px">
        <label style="margin:0 0 6px">Kata Sandi (minimal 6 karakter)</label>
        <input type="password" id="regPassword" placeholder="••••••••" required>
      </div>
      <div style="margin-bottom:20px">
        <label style="margin:0 0 6px">Tipe Akun</label>
        <select id="regRole">
          <option value="customer">Customer (Pencari & Pemesan Jasa)</option>
          <option value="creator">Creator (Penyedia Jasa Kreatif)</option>
        </select>
      </div>
      <button type="submit" id="btnRegister" class="btn" style="width:100%">Daftar Akun Baru</button>
    </form>
  </div>
</div>

<footer>
  Kreativa &copy; 2026 &bull; Platform Jasa Kreatif Digital
</footer>

<script src="/app.js"></script>
<script>
function switchTab(mode) {
  if (mode === 'login') {
    $('#formLogin').style.display = 'block';
    $('#formRegister').style.display = 'none';
    $('#tabLogin').className = 'tab on';
    $('#tabRegister').className = 'tab';
  } else {
    $('#formLogin').style.display = 'none';
    $('#formRegister').style.display = 'block';
    $('#tabLogin').className = 'tab';
    $('#tabRegister').className = 'tab on';
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = $('#btnLogin');
  await guard(btn, async () => {
    const email = $('#loginEmail').value.trim();
    const password = $('#loginPassword').value;
    
    const res = await api('/api/auth/login', {
      method: 'POST',
      body: { email, password }
    });

    saveSession(res);
    alert('Berhasil masuk!');
    
    if (res.user.role === 'admin') location.href = '/dashboard-admin.html';
    else if (res.user.role === 'creator') location.href = '/dashboard-creator.html';
    else location.href = '/';
  });
}

async function handleRegister(e) {
  e.preventDefault();
  const btn = $('#btnRegister');
  await guard(btn, async () => {
    const name = $('#regName').value.trim();
    const email = $('#regEmail').value.trim();
    const password = $('#regPassword').value;
    const role = $('#regRole').value;

    const res = await api('/api/auth/register', {
      method: 'POST',
      body: { name, email, password, role }
    });

    saveSession(res);
    alert('Pendaftaran berhasil!');

    if (res.user.role === 'creator') location.href = '/dashboard-creator.html#profil';
    else location.href = '/';
  });
}

document.addEventListener('DOMContentLoaded', () => {
  if (currentUser()) {
    location.href = '/';
  }
});
</script>
</body>
</html>
