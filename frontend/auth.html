<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Masuk / Daftar — Kreativa</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="/">🎨 Kreativa<span>.</span></a>
    <div class="links" id="navLinks"></div>
  </div>
</nav>

<div class="container" style="max-width:420px;margin-top:40px">
  <div class="form-card">
    <div class="row" style="gap:8px;margin-bottom:20px;justify-content:center">
      <button id="tabLogin" class="btn small" onclick="switchTab('login')">Login</button>
      <button id="tabRegister" class="btn small ghost" onclick="switchTab('register')">Daftar</button>
    </div>

    <!-- Form Login -->
    <form id="formLogin" onsubmit="handleLogin(event)">
      <div style="margin-bottom:12px">
        <label class="small" style="display:block;margin-bottom:4px">Email</label>
        <input type="email" id="loginEmail" placeholder="kamu@email.com" required style="width:100%">
      </div>
      <div style="margin-bottom:20px">
        <label class="small" style="display:block;margin-bottom:4px">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required style="width:100%">
      </div>
      <button type="submit" id="btnLogin" class="btn" style="width:100%;background:#7c3aed;color:#fff">Masuk</button>
    </form>

    <!-- Form Register -->
    <form id="formRegister" onsubmit="handleRegister(event)" style="display:none">
      <div style="margin-bottom:12px">
        <label class="small" style="display:block;margin-bottom:4px">Nama Lengkap</label>
        <input type="text" id="regName" placeholder="Nama kamu" required style="width:100%">
      </div>
      <div style="margin-bottom:12px">
        <label class="small" style="display:block;margin-bottom:4px">Email</label>
        <input type="email" id="regEmail" placeholder="kamu@email.com" required style="width:100%">
      </div>
      <div style="margin-bottom:12px">
        <label class="small" style="display:block;margin-bottom:4px">Password</label>
        <input type="password" id="regPassword" placeholder="••••••••" required style="width:100%">
      </div>
      <div style="margin-bottom:20px">
        <label class="small" style="display:block;margin-bottom:4px">Daftar Sebagai</label>
        <select id="regRole" style="width:100%">
          <option value="customer">Customer (Pembeli Jasa)</option>
          <option value="creator">Creator (Penyedia Jasa)</option>
        </select>
      </div>
      <button type="submit" id="btnRegister" class="btn" style="width:100%;background:#7c3aed;color:#fff">Daftar Akun</button>
    </form>
  </div>
</div>

<script src="/app.js"></script>
<script>
// Pindah Tab Login / Daftar
function switchTab(mode) {
  if (mode === 'login') {
    $('#formLogin').style.display = 'block';
    $('#formRegister').style.display = 'none';
    $('#tabLogin').className = 'btn small';
    $('#tabLogin').style.background = '';
    $('#tabRegister').className = 'btn small ghost';
  } else {
    $('#formLogin').style.display = 'none';
    $('#formRegister').style.display = 'block';
    $('#tabLogin').className = 'btn small ghost';
    $('#tabRegister').className = 'btn small';
    $('#tabRegister').style.background = '';
  }
}

// Proses Login
async function handleLogin(e) {
  e.preventDefault();
  const btn = $('#btnLogin');
  await guard(btn, async () => {
    const email = $('#loginEmail').value.trim();
    const password = $('#loginPassword').value;
    
    const res = await api('/api/auth/login', {
      method: 'POST',
      body: { email, password }
    });

    saveSession(res);
    alert('Berhasil masuk!');
    
    if (res.user.role === 'admin') location.href = '/dashboard-admin.html';
    else if (res.user.role === 'creator') location.href = '/dashboard-creator.html';
    else location.href = '/';
  });
}

// Proses Register
async function handleRegister(e) {
  e.preventDefault();
  const btn = $('#btnRegister');
  await guard(btn, async () => {
    const name = $('#regName').value.trim();
    const email = $('#regEmail').value.trim();
    const password = $('#regPassword').value;
    const role = $('#regRole').value;

    const res = await api('/api/auth/register', {
      method: 'POST',
      body: { name, email, password, role }
    });

    saveSession(res);
    alert('Pendaftaran berhasil!');

    if (res.user.role === 'creator') location.href = '/dashboard-creator.html#profil';
    else location.href = '/';
  });
}

// Redirect jika sudah login
document.addEventListener('DOMContentLoaded', () => {
  if (currentUser()) {
    location.href = '/';
  }
});
</script>
</body>
</html>
