<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pesanan Saya — Kreativa</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="/">Kreativa<span></span></a><div class="links" id="navLinks"></div></div></nav>
<div class="container" style="margin-top:24px;max-width:820px">
  <h2 style="font-size:22px;font-weight:700;margin-bottom:16px">Pesanan Saya</h2>
  <div id="view"><p class="muted">Memuat pesanan...</p></div>
</div>
<script src="/app.js"></script>
<script>
requireAuth('customer');
navbar();

async function renderOrders() {
  const all = await api('/api/orders');
  const qrisRes = await api('/api/qris');
  const qrisUrl = qrisRes.qris_image_url;

  $('#view').innerHTML = all.length ? all.map(o => `
    <div class="form-card" style="margin:12px 0">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <b style="font-size:15px">Order #${o.id} &bull; ${esc(o.service_title||'—')}</b>
        <div>${statusBadge(o.status)} ${payStatusBadge(o.payment_status || 'unpaid')}</div>
      </div>
      <p class="small muted" style="margin:0 0 12px">Creator: <b style="color:var(--ink)">${esc(o.creator_name||'—')}</b> &bull; Paket: ${esc(o.package_name||'—')} &bull; <b style="color:var(--ink)">${rupiah(o.price_snapshot)}</b></p>
      <div class="row" style="gap:8px">
        <a class="btn small" href="/order.html?id=${o.id}">Lihat Detail</a>
        ${['pending','diterima'].includes(o.status)?`<button class="btn small ghost" onclick="guard(this,()=>cancelOrder(${o.id}))">Batalkan Pesanan</button>`:''}
      </div>

      <!-- TAMPILAN PEMBAYARAN -->
      ${renderPaymentSection(o, qrisUrl)}
    </div>
  `).join('') : '<p class="muted">Belum ada pesanan aktif. <a href="/" style="color:var(--brand);font-weight:600">Cari layanan kreator &rarr;</a></p>';
}

function renderPaymentSection(o, qrisUrl) {
  if (o.payment_status === 'paid') {
    return `<div class="hint" style="margin-top:12px;background:var(--green-bg);border-color:var(--green-border);color:var(--green-text)">Pembayaran lunas. Kreator sedang mengerjakan pesananmu.</div>`;
  }
  if (o.payment_status === 'verifying') {
    return `<div class="hint" style="margin-top:12px;background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber-text)">Bukti pembayaran telah terkirim dan sedang diverifikasi oleh Admin.</div>`;
  }
  if (o.payment_status === 'rejected') {
    return `<div class="hint" style="margin-top:12px;background:var(--red-bg);border-color:var(--red-border);color:var(--red-text)">Pembayaran ditolak oleh Admin. Silakan unggah kembali bukti pembayaran yang valid.</div>
    ${paymentUploadForm(o, qrisUrl)}`;
  }

  return paymentUploadForm(o, qrisUrl);
}

function paymentUploadForm(o, qrisUrl) {
  return `
    <div class="form-card" style="background:var(--border-light);margin-top:14px;border:1px solid var(--border)">
      <h4 style="margin:0 0 8px;font-size:14px">Instruksi Pembayaran QRIS</h4>
      ${qrisUrl ? `<img src="${qrisUrl}" style="max-width:180px;display:block;margin:10px 0;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;padding:6px">` : '<p class="small muted">Kode QRIS belum diatur oleh Admin.</p>'}
      <p class="small" style="margin:0 0 10px">Scan QRIS di atas sejumlah <b>${rupiah(o.price_snapshot)}</b>, lalu unggah bukti transfer di bawah:</p>

      <div class="row">
        <input type="file" id="payFile-${o.id}" accept=".jpg,.jpeg,.png" style="flex:1" onchange="pickUpload('payFile-${o.id}','payUrl-${o.id}','payMsg-${o.id}')">
        <span class="small muted" id="payMsg-${o.id}"></span>
      </div>
      <input type="hidden" id="payUrl-${o.id}">
      <button class="btn small" style="margin-top:10px" onclick="guard(this,()=>submitPay(${o.id}))">Kirim Bukti Pembayaran</button>
    </div>`;
}

async function submitPay(oid) {
  const proofUrl = $('#payUrl-' + oid).value;
  if (!proofUrl) throw new Error('Silakan pilih dan upload file foto bukti transfer terlebih dahulu.');
  await api(`/api/orders/${oid}/pay`, { method: 'POST', body: { payment_proof_url: proofUrl } });
  alert('Bukti transfer berhasil dikirim. Menunggu verifikasi admin.');
  renderOrders();
}

async function cancelOrder(oid) {
  if (!confirm('Apakah kamu yakin ingin membatalkan pesanan ini?')) return;
  await api('/api/orders/' + oid + '/status', { method: 'PATCH', body: { status: 'dibatalkan' } });
  renderOrders();
}

renderOrders().catch(e => $('#view').innerHTML = '<p>' + esc(e.message) + '</p>');
</script>
</body>
</html>
