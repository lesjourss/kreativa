<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Akun Saya — Kreativa</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="/">Kreativa<span></span></a><div class="links" id="navLinks"></div></div></nav>
<div class="container" style="margin-top:24px;max-width:640px">
  <h2 style="font-size:22px;font-weight:700;margin-bottom:16px">Pengaturan Akun</h2>
  <div id="view"><p class="muted">Memuat data akun...</p></div>
</div>

<footer>
  Kreativa &copy; 2026 &bull; Platform Jasa Kreatif Digital
</footer>

<script src="/app.js"></script>
<script>
const me=requireAuth(); navbar();
async function init(){
  const {user}=await api('/api/me'); const isC=user.role==='creator';
  $('#view').innerHTML=`<div class="form-card">
    <div class="row" style="gap:16px">
      <img src="${esc(user.avatar_url||'https://i.pravatar.cc/100?u='+user.id)}" class="avatar" id="avPrev" alt="${esc(user.name)}" style="width:64px;height:64px">
      <div>
        <h3 style="margin:0 0 4px;font-size:18px">${esc(user.name)}</h3>
        <div class="small muted">${esc(user.email)} &bull; ${isC?'Creator (Penyedia Jasa)':'Customer (Pelanggan)'}<br>Bergabung sejak ${esc((user.created_at||'').slice(0,10))}</div>
      </div>
    </div>
    <div class="row" style="margin-top:16px;gap:8px">
      ${isC?`<a class="btn small" href="/dashboard-creator.html#orders">Kelola Pesanan</a><a class="btn small ghost" href="/store.html?creator=${user.id}">Lihat Toko Saya</a>`:`<a class="btn small" href="/dashboard-customer.html">Pesanan Saya</a><button class="btn small ghost" onclick="openStore()">Buka Lapak Creator</button>`}
    </div>
  </div>

  <div class="form-card" style="margin-top:16px">
    <h3 style="margin:0 0 12px;font-size:16px">Ubah Data Profil</h3>
    <label>Nama Lengkap</label><input id="nm" value="${esc(user.name)}">
    <label>Foto Profil</label>
    <div class="row"><input type="file" id="avFile" accept=".jpg,.jpeg,.png,.webp,.gif" style="flex:1" onchange="pickUpload('avFile','av','avMsg')"><span class="small muted" id="avMsg"></span></div>
    <input id="av" value="${esc(user.avatar_url||'')}" placeholder="...atau tempel URL foto profil" style="margin-top:8px">
    <button class="btn small" style="margin-top:14px" onclick="guard(this,saveProfile)">Simpan Perubahan</button>
  </div>

  <div class="form-card" style="margin-top:16px">
    <h3 style="margin:0 0 12px;font-size:16px">Ganti Password</h3>
    <label>Password Saat Ini</label><input id="op" type="password" placeholder="••••••••">
    <label>Password Baru (minimal 6 karakter)</label><input id="np" type="password" placeholder="••••••••">
    <button class="btn small ghost" style="margin-top:14px" onclick="guard(this,savePass)">Update Password</button>
  </div>

  <p style="margin-top:20px"><button class="btn ghost small" onclick="logout()">Logout dari Akun</button></p>`;
}
async function saveProfile(){
  const name=$('#nm').value.trim(), av=$('#av').value.trim();
  await api('/api/me',{method:'PATCH',body:{name,avatar_url:av}});
  if(me.role==='creator') await api('/api/creator/profile',{method:'PATCH',body:{avatar_url:av}});
  saveSession({token:getToken(),user:{...me,name,avatar_url:av}});
  alert('Data profil berhasil diperbarui!'); location.reload();
}
async function savePass(){ 
  await api('/api/me/password',{method:'PATCH',body:{old_password:$('#op').value,new_password:$('#np').value}}); 
  $('#op').value=$('#np').value=''; 
  alert('Password berhasil diperbarui.'); 
}
init().catch(e=>$('#view').innerHTML='<p class="muted">'+esc(e.message)+'</p>');
</script>
</body>
</html>
