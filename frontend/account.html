<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akun Saya — Kreativa</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="/">🎨 Kreativa<span>.</span></a><div class="links" id="navLinks"></div></div></nav>
<div class="container" style="margin-top:16px;max-width:640px"><h2>👤 Akun Saya</h2><div id="view"><p>Memuat...</p></div></div>
<script src="/app.js"></script>
<script>
const me=requireAuth(); navbar();
async function init(){
  const {user}=await api('/api/me'); const isC=user.role==='creator';
  $('#view').innerHTML=`<div class="form-card">
    <div class="row"><img src="${esc(user.avatar_url||'https://i.pravatar.cc/100?u='+user.id)}" class="avatar" id="avPrev">
    <div><h3 style="margin:0">${esc(user.name)}</h3><div class="small muted">${esc(user.email)} • ${isC?'Creator':'Customer'}<br>Bergabung ${esc((user.created_at||'').slice(0,10))}</div></div></div>
    <div class="row" style="margin-top:12px">${isC?`<a class="btn small" href="/dashboard-creator.html#orders">📥 Pesanan</a><a class="btn small ghost" href="/store.html?creator=${user.id}">🏪 Toko saya</a>`:`<a class="btn small" href="/dashboard-customer.html">📦 Pesanan saya</a><button class="btn small warn" onclick="openStore()">Buka Lapak Creator</button>`}</div></div>
  <div class="form-card" style="margin-top:14px"><h3>Ubah profil</h3>
    <label>Nama</label><input id="nm" value="${esc(user.name)}">
    <label>Foto profil</label><div class="row"><input type="file" id="avFile" accept=".jpg,.jpeg,.png,.webp,.gif" style="flex:1" onchange="pickUpload('avFile','av','avMsg')"><span class="small muted" id="avMsg"></span></div>
    <input id="av" value="${esc(user.avatar_url||'')}" placeholder="...atau tempel URL foto" style="margin-top:6px">
    <button class="btn small" style="margin-top:10px" onclick="guard(this,saveProfile)">Simpan</button></div>
  <div class="form-card" style="margin-top:14px"><h3>Ganti password</h3>
    <label>Password lama</label><input id="op" type="password"><label>Password baru (min 6)</label><input id="np" type="password">
    <button class="btn small" style="margin-top:10px" onclick="guard(this,savePass)">Ganti password</button></div>
  <p style="margin-top:14px"><button class="btn ghost" onclick="logout()">Logout</button></p>`;
}
async function saveProfile(){
  const name=$('#nm').value.trim(), av=$('#av').value.trim();
  await api('/api/me',{method:'PATCH',body:{name}});
  if(me.role==='creator') await api('/api/creator/profile',{method:'PATCH',body:{avatar_url:av}});   // sinkron foto toko
  else await api('/api/me',{method:'PATCH',body:{name,avatar_url:av}});
  saveSession({token:localStorage.getItem('token'),user:{...me,name,avatar_url:av}});
  alert('Tersimpan!'); location.reload();
}
async function savePass(){ await api('/api/me/password',{method:'PATCH',body:{old_password:$('#op').value,new_password:$('#np').value}}); $('#op').value=$('#np').value=''; alert('Password diganti.'); }
init().catch(e=>$('#view').innerHTML='<p>'+esc(e.message)+'</p>');
</script>
</body>
</html>
