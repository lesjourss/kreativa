<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Creator — Kreativa</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="/">🎨 Kreativa<span>.</span></a><div class="links" id="navLinks"></div></div></nav>
<div class="container" style="margin-top:16px">
<h2>🎛️ Dashboard Creator</h2>
<div class="tabs">
  <button class="tab on" onclick="show('orders')">📥 Order Masuk</button>
  <button class="tab" onclick="show('shop')">🏪 Kelola Jasa & Portofolio</button>
  <button class="tab" onclick="show('boost')">🚀 Booster</button>
  <button class="tab" onclick="show('profile')">👤 Profil</button>
</div>
<div id="sec-orders"></div>
<div id="sec-shop" style="display:none"></div>
<div id="sec-boost" style="display:none"></div>
<div id="sec-profile" style="display:none"></div>
</div>
<script src="/app.js"></script>
<script>
navbar();
const u=requireAuth('creator');
function show(x){ ['orders','shop','boost','profile'].forEach(k=>{ $('#sec-'+k).style.display=k===x?'block':'none'; }); $$('.tab').forEach(t=>t.classList.remove('on')); event.target.classList.add('on'); }
async function init(){
  const prof=await api('/api/creator/profile');
  renderProfile(prof);
  renderOrders(); renderShop(); renderBoost();
}
async function renderOrders(){
  const orders=await api('/api/orders');
  $('#sec-orders').innerHTML=`<div class="form-card"><h3>📥 Order masuk (${orders.length})</h3>
  <table><tr><th>ID</th><th>Customer</th><th>Jasa</th><th>Status</th><th>Aksi</th></tr>
  ${orders.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.customer_name)}<br><span class="small muted">${esc(o.need_desc).slice(0,60)}</span></td><td class="small">${esc(o.service_title||'')} / ${esc(o.package_name||'')}</td><td>${statusBadge(o.status)}</td>
  <td><div class="row">${nextActions(o)}</div></td></tr>`).join('')}</table></div>`;
}
function nextActions(o){
  const btn=(s,l)=>`<button class="btn small ghost" onclick="setStatus(${o.id},'${s}')">${l}</button>`;
  let h=`<a class="btn small" href="/order.html?id=${o.id}">Detail</a>`;
  if(o.status==='pending') h+=btn('diterima','Terima')+btn('ditolak','Tolak');
  if(o.status==='diterima') h+=btn('dikerjakan','Kerjakan');
  if(o.status==='dikerjakan') h+=btn('selesai','Selesaikan');
  if(o.status==='revisi') h+=btn('dikerjakan','Kerjakan revisi')+btn('selesai','Selesai');
  return h;
}
async function setStatus(id,s){ try{ await api('/api/orders/'+id+'/status',{method:'PATCH',body:{status:s}}); renderOrders(); }catch(e){ alert(e.message); } }

async function renderShop(){
  const store=await api('/api/creators/'+u.id+'/store');
  const cats=await api('/api/categories');
  $('#sec-shop').innerHTML=`
  <div class="form-card"><h3>🏪 Jasa saya (${store.services.length})</h3>
    <div class="row"><input id="nsTitle" placeholder="Judul jasa baru..." style="flex:2;min-width:200px">
    <select id="nsCat" style="flex:1">${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
    <input id="nsDesc" placeholder="Deskripsi (min 10 karakter)" style="margin-top:8px">
    <input id="nsThumb" placeholder="Thumbnail URL (opsional, kosongkan = random)" style="margin-top:8px">
    <div class="row" style="margin-top:8px"><input type="file" id="nsFile" accept=".jpg,.jpeg,.png,.webp,.gif" style="flex:1" onchange="pickUpload('nsFile','nsThumb','nsMsg')"><span class="small muted" id="nsMsg">…atau upload JPG/PNG langsung</span></div>
    <button class="btn small" style="margin-top:8px" onclick="addService()">+ Tambah Jasa</button>
    <hr>${store.services.map(s=>`
      <div class="form-card" style="margin:8px 0"><b>${esc(s.title)}</b> <span class="small muted">${esc(s.category_name||'')}</span>
      <div class="small">Paket: ${s.packages.map(p=>`${esc(p.name)} Rp${Number(p.price).toLocaleString('id-ID')}`).join(' • ')||'-'}</div>
      <div class="row" style="margin-top:6px">
        <input id="pk-${s.id}-name" placeholder="Nama paket" style="max-width:130px"><input id="pk-${s.id}-price" type="number" placeholder="Harga" style="max-width:110px">
        <input id="pk-${s.id}-days" type="number" value="3" style="max-width:70px" title="Estimasi hari"><input id="pk-${s.id}-rev" type="number" value="1" style="max-width:70px" title="Revisi">
        <button class="btn small ghost" onclick="addPkg(${s.id})">+ Paket</button>
        <button class="btn small ghost" onclick="delService(${s.id})">Hapus jasa</button>
      </div></div>`).join('')}
  </div>
  <div class="form-card" style="margin-top:12px"><h3>🖼️ Portofolio (${store.portfolios.length})</h3>
    <div class="row"><input id="pfUrl" placeholder="Image URL" style="flex:2"><input id="pfTitle" placeholder="Judul" style="flex:1"><button class="btn small" onclick="addPf()">+ Upload</button></div>
    <div class="row" style="margin-top:8px"><input type="file" id="pfFile" accept=".jpg,.jpeg,.png,.webp,.gif" style="flex:1" onchange="pickUpload('pfFile','pfUrl','pfMsg')"><span class="small muted" id="pfMsg">…atau pilih file JPG/PNG</span></div>
    <div class="grid cards" style="margin-top:10px">${store.portfolios.map(p=>`<div class="card"><img class="thumb" src="${esc(p.image_url)}"><div class="card-body small"><b>${esc(p.title)}</b><br><button class="btn small ghost" onclick="delPf(${p.id})">Hapus</button></div></div>`).join('')}</div>
  </div>`;
}
async function addService(){ try{ await api('/api/services',{method:'POST',body:{title:$('#nsTitle').value,description:$('#nsDesc').value,category_id:+$('#nsCat').value,thumbnail_url:$('#nsThumb').value}}); renderShop(); }catch(e){ alert(e.message); } }
async function delService(id){ if(!confirm('Hapus jasa?'))return; await api('/api/services/'+id,{method:'DELETE'}); renderShop(); }
async function addPkg(sid){ try{ await api('/api/services/'+sid+'/packages',{method:'POST',body:{name:$('#pk-'+sid+'-name').value,price:+$('#pk-'+sid+'-price').value||0,estimated_days:+$('#pk-'+sid+'-days').value||3,revision_count:+$('#pk-'+sid+'-rev').value||0}}); renderShop(); }catch(e){ alert(e.message); } }
async function addPf(){ try{ await api('/api/portfolios',{method:'POST',body:{image_url:$('#pfUrl').value,title:$('#pfTitle').value}}); renderShop(); }catch(e){ alert(e.message); } }
async function delPf(id){ await api('/api/portfolios/'+id,{method:'DELETE'}); renderShop(); }

async function renderBoost(){
  const plans=await api('/api/booster/plans');
  const mine=await api('/api/booster/mine');
  const store=await api('/api/creators/'+u.id+'/store');
  $('#sec-boost').innerHTML=`<div class="form-card"><h3>🚀 Booster (simulasi pembayaran)</h3>
    <p class="small muted">Jasa yang di-boost tampil paling atas + badge ⚡ Promoted.</p>
    <div class="row"><select id="bPlan">${plans.map(p=>`<option value="${p.id}">${esc(p.name)} — Rp${Number(p.price).toLocaleString('id-ID')} / ${p.duration_days} hari</option>`).join('')}</select>
    <select id="bSvc">${store.services.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select>
    <button class="btn small warn" onclick="buyBoost()">Aktifkan Booster</button></div>
    <h4>Riwayat booster</h4>${mine.map(b=>`<div class="small">• ${esc(b.plan_name)} — service #${b.service_id} — ${b.start_date.slice(0,10)} → ${b.end_date.slice(0,10)} [${b.payment_status}]</div>`).join('')||'<p class="small muted">Belum ada.</p>'}</div>`;
}
async function buyBoost(){ try{ await api('/api/booster/purchase',{method:'POST',body:{booster_plan_id:+$('#bPlan').value,service_id:+$('#bSvc').value}}); alert('Booster aktif (mock paid)!'); renderBoost(); }catch(e){ alert(e.message); } }

function renderProfile(prof){
  $('#sec-profile').innerHTML=`<div class="form-card"><h3>👤 Profil & ketersediaan</h3>
  <p class="small">Pending order: <b>${prof.orders_pending}</b> • Booster aktif: <b>${prof.booster_active}</b></p>
  <label>Bio</label><textarea id="bio" rows="3">${esc(prof.profile?.bio||'')}</textarea>
  <label>Avatar URL</label><input id="ava" value="${esc(prof.profile?.avatar_url||'')}">
  <div class="row" style="margin-top:8px"><input type="file" id="avaFile" accept=".jpg,.jpeg,.png,.webp,.gif" style="flex:1" onchange="pickUpload('avaFile','ava','avaMsg')"><span class="small muted" id="avaMsg">…atau upload foto</span></div>
  <label>Status order</label><select id="avail"><option value="open">🟢 Open for order</option><option value="closed">🔴 Closed</option></select>
  <button class="btn small" style="margin-top:10px" onclick="saveProfile()">Simpan</button>
  <p class="small"><a href="/store.html?creator=${u.id}">Lihat store publik saya →</a></p></div>`;
  $('#avail').value=prof.profile?.availability_status||'open';
}
async function saveProfile(){ try{ await api('/api/creator/profile',{method:'PATCH',body:{bio:$('#bio').value,avatar_url:$('#ava').value}}); await api('/api/creator/availability',{method:'PATCH',body:{availability_status:$('#avail').value}}); alert('Tersimpan!'); }catch(e){ alert(e.message); } }
init();
</script>
</body>
</html>
