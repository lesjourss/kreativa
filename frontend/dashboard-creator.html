<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard Creator — Kreativa</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="/">Kreativa<span></span></a><div class="links" id="navLinks"></div></div></nav>
<div class="container" style="margin-top:24px">
  <h2 id="dashTitle" style="font-size:22px;font-weight:700;margin-bottom:16px">Pesanan Masuk</h2>
  <div id="view"><p class="muted">Memuat data...</p></div>
</div>
<script src="/app.js"></script>
<script>
const me = requireAuth('creator');
navbar();

// ---------- Routing berdasarkan hash ----------
const SECTIONS = {orders:'Pesanan Masuk', jasa:'Layanan & Paket', portofolio:'Portofolio', booster:'Booster Promosi', profil:'Profil Toko'};
function route(){
  const k = location.hash.slice(1) || 'orders';
  $('#dashTitle').textContent = SECTIONS[k] || SECTIONS.orders;
  markSubnav();
  if(k==='orders') renderOrders();
  else if(k==='jasa') renderJasa();
  else if(k==='portofolio') renderPortofolio();
  else if(k==='booster') renderBooster();
  else if(k==='profil') renderProfil();
  else renderOrders();
}
window.addEventListener('hashchange', route);

// ===== TAB 1: PESANAN =====
async function renderOrders(){
  const all = await api('/api/orders');
  $('#view').innerHTML = all.length ? `<div class="tabs">
    <button class="tab on" onclick="filterOrders(this,'all')">Semua (${all.length})</button>
    <button class="tab" onclick="filterOrders(this,'pending')">Menunggu</button>
    <button class="tab" onclick="filterOrders(this,'dikerjakan')">Dikerjakan</button>
    <button class="tab" onclick="filterOrders(this,'selesai')">Selesai</button>
  </div><div id="orderList">${orderCards(all)}</div>` : '<p class="muted">Belum ada pesanan masuk.</p>';
}
function filterOrders(btn, f){
  $$('.tabs .tab').forEach(t=>t.classList.remove('on')); btn.classList.add('on');
  api('/api/orders').then(all=>{
    const filtered = f==='all' ? all : all.filter(o=>o.status===f);
    $('#orderList').innerHTML = filtered.length ? orderCards(filtered) : '<p class="muted">Tidak ada pesanan dengan status ini.</p>';
  });
}
function orderCards(list){
  return list.map(o=>`<div class="form-card" style="margin:12px 0">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <b style="font-size:15px">Order #${o.id} &bull; ${esc(o.service_title||'—')}</b>
      <div>${statusBadge(o.status)} ${payStatusBadge(o.payment_status||'unpaid')}</div>
    </div>
    <p class="small muted" style="margin:4px 0 12px">Customer: <b style="color:var(--ink)">${esc(o.customer_name)}</b> &bull; Paket: ${esc(o.package_name||'—')} &bull; <b style="color:var(--ink)">${rupiah(o.price_snapshot)}</b></p>
    <div class="row" style="gap:8px">${orderActions(o)}</div>
  </div>`).join('');
}
function orderActions(o){
  if (o.payment_status !== 'paid') {
    return `<a class="btn small ghost" href="/order.html?id=${o.id}">Detail</a> <span class="small muted">Menunggu konfirmasi pembayaran oleh Admin</span>`;
  }

  const b=(s,l,c='ghost')=>`<button class="btn small ${c}" onclick="guard(this,()=>setStatus(${o.id},'${s}'))">${l}</button>`;
  let h=`<a class="btn small ghost" href="/order.html?id=${o.id}">Detail</a>`;
  if(o.status==='pending') h+=b('diterima','Terima Pesanan','')+b('ditolak','Tolak','ghost');
  if(o.status==='diterima') h+=b('dikerjakan','Mulai Kerjakan');
  if(['diterima','dikerjakan','revisi'].includes(o.status)) h+=`<a class="btn small" href="/order.html?id=${o.id}#kirim">Kirim Hasil</a>`;
  if(o.status==='revisi') h+=b('dikerjakan','Kerjakan Revisi');
  return h;
}
async function setStatus(id, s){
  await api('/api/orders/'+id+'/status',{method:'PATCH',body:{status:s}});
  renderOrders();
}

// ===== TAB 2: JASA & PAKET =====
async function renderJasa(){
  const [services, cats] = await Promise.all([
    api('/api/creators/'+me.id+'/store').then(d=>d.services),
    api('/api/categories')
  ]);
  $('#view').innerHTML = `
    <div class="form-card" style="margin-bottom:20px">
      <h3 style="margin:0 0 14px">Tambah Layanan Baru</h3>
      <label>Judul Layanan</label><input id="sTitle" placeholder="Contoh: Desain Brand Identity & Logo">
      <label>Deskripsi</label><textarea id="sDesc" rows="3" placeholder="Jelaskan cakupan layanan yang kamu tawarkan..."></textarea>
      <label>Kategori</label><select id="sCat"><option value="">Pilih kategori</option>${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      <label>Foto Sampul / Thumbnail</label>
      <div class="row"><input type="file" id="sThumbFile" accept=".jpg,.jpeg,.png,.webp,.gif" style="flex:1" onchange="pickUpload('sThumbFile','sThumb','sThumbMsg')"><span class="small muted" id="sThumbMsg"></span></div>
      <img id="sThumbPrev" class="prev"><input id="sThumb" type="hidden">
      <button class="btn" style="margin-top:14px" onclick="guard(this,addService)">Tambah Layanan</button>
    </div>
    <h3 style="margin:24px 0 12px">Layanan Kamu (${services.length})</h3>
    <div id="jasaList">${services.length ? services.map(s=>jasaCard(s)).join('') : '<p class="muted">Belum ada layanan aktif. Tambahkan layanan pertamamu!</p>'}</div>`;
}
function jasaCard(s){
  return `<div class="form-card" style="margin:12px 0">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <h4 style="margin:0;font-size:16px">${esc(s.title)} ${s.is_boosted?'<span class="badge boost">Promoted</span>':''}</h4>
      <div><button class="btn small ghost" onclick="guard(this,()=>delService(${s.id}))">Hapus</button></div>
    </div>
    <p class="small muted" style="margin:0 0 12px">${esc(s.category_name||'Tanpa kategori')} &bull; ${esc((s.description||'').slice(0,100))}</p>
    <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px">PAKET LAYANAN (${s.packages.length})</div>
    ${s.packages.map(p=>`<div class="pkg row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
      <span><b>${esc(p.name)}</b> &mdash; ${rupiah(p.price)} &bull; ${p.estimated_days} hari &bull; ${p.revision_count}x revisi</span>
      <button class="btn small ghost" onclick="guard(this,()=>delPkg(${p.id}))">Hapus</button>
    </div>`).join('')||'<p class="small muted">Belum ada paket.</p>'}
    <div class="pkg-form" style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)">
      <input id="pName-${s.id}" placeholder="Nama paket (cth: Basic)">
      <input id="pPrice-${s.id}" type="number" placeholder="Harga (Rp)" min="0">
      <input id="pDays-${s.id}" type="number" placeholder="Estimasi (hari)" min="1" value="3">
      <input id="pRev-${s.id}" type="number" placeholder="Jml revisi" min="0" value="1">
      <button class="btn small ghost" onclick="guard(this,()=>addPkg(${s.id}))">+ Paket</button>
    </div>
  </div>`;
}
async function addService(){
  const cat = $('#sCat').value;
  await api('/api/services',{method:'POST',body:{title:$('#sTitle').value,description:$('#sDesc').value,category_id:cat?+cat:null,thumbnail_url:$('#sThumb').value||''}});
  alert('Layanan berhasil ditambahkan!');
  renderJasa();
}
async function delService(id){
  if(!confirm('Hapus layanan ini beserta semua paketnya?')) return;
  await api('/api/services/'+id,{method:'DELETE'});
  renderJasa();
}
async function addPkg(sid){
  await api('/api/services/'+sid+'/packages',{method:'POST',body:{
    name:$('#pName-'+sid).value,
    price:+$('#pPrice-'+sid).value,
    estimated_days:+$('#pDays-'+sid).value,
    revision_count:+$('#pRev-'+sid).value
  }});
  renderJasa();
}
async function delPkg(pid){
  if(!confirm('Hapus paket ini?')) return;
  await api('/api/packages/'+pid,{method:'DELETE'});
  renderJasa();
}

// ===== TAB 3: PORTOFOLIO =====
async function renderPortofolio(){
  const items = await api('/api/portfolios?creator_id='+me.id);
  $('#view').innerHTML = `
    <div class="form-card" style="margin-bottom:20px">
      <h3 style="margin:0 0 14px">Tambah Karya Portofolio</h3>
      <label>Judul Karya</label><input id="pfTitle" placeholder="Contoh: Brand Redesign Kopi Nusantara">
      <label>Deskripsi (opsional)</label><textarea id="pfDesc" rows="2"></textarea>
      <label>Foto / Karya Visual (JPG/PNG)</label>
      <div class="row"><input type="file" id="pfFile" accept=".jpg,.jpeg,.png,.webp,.gif" style="flex:1" onchange="pickUpload('pfFile','pfUrl','pfMsg')"><span class="small muted" id="pfMsg"></span></div>
      <img id="pfUrlPrev" class="prev"><input id="pfUrl" type="hidden">
      <button class="btn" style="margin-top:14px" onclick="guard(this,addPorto)">Upload Karya</button>
    </div>
    <h3 style="margin:24px 0 12px">Portofolio Kamu (${items.length})</h3>
    <div class="grid cards">${items.map(p=>`<div class="card">
      <img class="thumb" src="${esc(p.image_url)}" onerror="this.onerror=null;this.src='https://picsum.photos/seed/kreativa/600/400'">
      <div class="card-body">
        <b>${esc(p.title||'Tanpa judul')}</b>
        <p class="small muted" style="margin:4px 0 12px">${esc(p.description||'')}</p>
        <button class="btn small ghost" style="margin-top:auto" onclick="guard(this,()=>delPorto(${p.id}))">Hapus</button>
      </div>
    </div>`).join('')||'<p class="muted">Belum ada portofolio.</p>'}</div>`;
}
async function addPorto(){
  const url = $('#pfUrl').value;
  if(!url) throw new Error('Upload gambar dulu!');
  await api('/api/portfolios',{method:'POST',body:{title:$('#pfTitle').value,description:$('#pfDesc').value,image_url:url}});
  alert('Portofolio berhasil ditambahkan!');
  renderPortofolio();
}
async function delPorto(pid){
  if(!confirm('Hapus portofolio ini?')) return;
  await api('/api/portfolios/'+pid,{method:'DELETE'});
  renderPortofolio();
}

// ===== TAB 4: BOOSTER =====
async function renderBooster(){
  const [plans, mine] = await Promise.all([api('/api/booster/plans'), api('/api/booster/mine')]);
  const services = await api('/api/creators/'+me.id+'/store').then(d=>d.services);
  const active = mine.filter(b=>b.payment_status==='paid' && new Date(b.end_date)>new Date());
  $('#view').innerHTML = `
    ${active.length?`<div class="hint"><b>${active.length}</b> paket booster sedang aktif pada tokomu.</div>`:''}
    <h3 style="margin:20px 0 12px">Paket Booster Tersedia</h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px">
      ${plans.map(p=>`<div class="form-card" style="display:flex;flex-direction:column;justify-content:space-between">
        <div>
          <h3 style="margin:0 0 6px">${esc(p.name)}</h3>
          <p class="small muted" style="margin:0 0 14px">${esc(p.description)}</p>
          <div style="font-size:22px;font-weight:800;color:var(--ink);margin-bottom:4px">${rupiah(p.price)}</div>
          <div class="small muted">Durasi aktif: ${p.duration_days} hari</div>
        </div>
        <div style="margin-top:16px">
          <select id="bSvc-${p.id}" style="margin-bottom:10px">
            <option value="">Promosikan seluruh toko</option>
            ${services.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}
          </select>
          <button class="btn small" style="width:100%" onclick="guard(this,()=>buyBoost(${p.id}))">Beli Paket</button>
        </div>
      </div>`).join('')}
    </div>
    <h3 style="margin:32px 0 12px">Riwayat Booster</h3>
    <div class="form-card" style="padding:0;overflow:hidden">
    ${mine.length?`<table><thead><tr><th>Paket</th><th>Mulai</th><th>Berakhir</th><th>Status</th></tr></thead><tbody>
      ${mine.map(b=>`<tr><td><b>${esc(b.plan_name)}</b></td><td>${fmtDate(b.start_date)}</td><td>${fmtDate(b.end_date)}</td>
        <td>${new Date(b.end_date)>new Date()?'<span class="badge open">Aktif</span>':'<span class="badge closed">Berakhir</span>'}</td></tr>`).join('')}
    </tbody></table>`:'<p class="muted" style="padding:16px">Belum pernah membeli booster.</p>'}
    </div>`;
}
async function buyBoost(planId){
  const svcEl = $('#bSvc-'+planId);
  const svc = svcEl ? svcEl.value : '';
  const body = {booster_plan_id:planId};
  if(svc) body.service_id = +svc;
  if(!confirm('Beli booster ini? (Simulasi pembayaran)')) return;
  await api('/api/booster/purchase',{method:'POST',body});
  alert('Booster aktif! Layanan kamu sekarang diprioritaskan di pencarian.');
  renderBooster();
}

// ===== TAB 5: PROFIL TOKO =====
async function renderProfil(){
  const {profile} = await api('/api/creator/profile');
  const p = profile || {};
  $('#view').innerHTML = `<div class="form-card">
    <h3 style="margin:0 0 16px">Pengaturan Profil Toko</h3>
    <label>Bio & Deskripsi Singkat</label>
    <textarea id="prBio" rows="4" placeholder="Perkenalkan keahlian dan latar belakang kreatifmu...">${esc(p.bio||'')}</textarea>
    <label>Foto Profil Toko</label>
    <div class="row"><input type="file" id="prAvFile" accept=".jpg,.jpeg,.png,.webp,.gif" style="flex:1" onchange="pickUpload('prAvFile','prAv','prAvMsg')"><span class="small muted" id="prAvMsg"></span></div>
    <img id="prAvPrev" src="${esc(p.avatar_url||'')}" class="prev" ${p.avatar_url?'style="display:block"':''}>
    <input id="prAv" value="${esc(p.avatar_url||'')}" placeholder="...atau tempel URL foto" style="margin-top:8px">
    <button class="btn" style="margin-top:14px" onclick="guard(this,saveProfil)">Simpan Profil</button>
    <hr style="margin:24px 0;border:0;border-top:1px solid var(--border)">
    <h3 style="margin:0 0 8px">Status Ketersediaan Order</h3>
    <p class="small muted" style="margin:0 0 12px">Saat ditutup (Closed), calon customer tidak dapat melakukan pemesanan baru pada tokomu.</p>
    <div class="row" style="gap:10px">
      <button class="btn small ${p.availability_status==='open'?'':'ghost'}" onclick="guard(this,()=>setAvail('open'))">Open for Order</button>
      <button class="btn small ${p.availability_status==='closed'?'warn':'ghost'}" onclick="guard(this,()=>setAvail('closed'))">Closed</button>
    </div>
    <p class="small muted" style="margin-top:10px">Status aktif: <b>${p.availability_status==='closed'?'Tutup (Closed)':'Buka (Open for Order)'}</b></p>
  </div>`;
}
async function saveProfil(){
  await api('/api/creator/profile',{method:'PATCH',body:{bio:$('#prBio').value,avatar_url:$('#prAv').value}});
  alert('Profil berhasil diperbarui!');
  renderProfil();
}
async function setAvail(status){
  await api('/api/creator/availability',{method:'PATCH',body:{availability_status:status}});
  renderProfil();
}

// ===== INIT =====
route();
</script>
</body>
</html>
