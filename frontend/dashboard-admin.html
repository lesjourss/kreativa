<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin &mdash; Kreativa</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="/">Kreativa<span></span></a><div class="links" id="navLinks"></div></div></nav>
<div class="container" style="margin-top:24px;max-width:880px">
  <h2 style="font-size:22px;font-weight:700;margin-bottom:16px">Panel Admin &mdash; Verifikasi Pembayaran</h2>
  
  <!-- Form Set QRIS Admin -->
  <div class="form-card" style="margin-bottom:24px">
    <h3 style="margin:0 0 8px;font-size:16px">Pengaturan QRIS Platform</h3>
    <p class="small muted" style="margin:0 0 12px">QRIS ini akan ditampilkan saat customer membayar pesanan jasa dan saat creator membeli paket Booster.</p>
    <label>Upload Gambar QRIS Platform (JPG/PNG)</label>
    <div class="row">
      <input type="file" id="qrisFile" accept=".jpg,.jpeg,.png" style="flex:1" onchange="pickUpload('qrisFile','qrisUrl','qrisMsg')">
      <span class="small muted" id="qrisMsg"></span>
    </div>
    <input id="qrisUrl" placeholder="URL Gambar QRIS" style="margin-top:8px">
    <img id="qrisUrlPrev" class="prev" style="max-width:180px;display:none;margin-top:8px">
    <button class="btn small" style="margin-top:12px" onclick="guard(this,saveQris)">Simpan Gambar QRIS</button>
  </div>

  <!-- Tabs Verifikasi -->
  <div class="tabs" style="margin-bottom:16px">
    <button id="tabOrders" class="tab on" onclick="switchAdminTab('orders')">Verifikasi Order Jasa</button>
    <button id="tabBoosters" class="tab" onclick="switchAdminTab('boosters')">Verifikasi Booster Creator (SaaS)</button>
  </div>

  <!-- Section 1: Daftar Pembayaran Order Customer -->
  <div id="sectionOrders">
    <div id="paymentList"><p class="muted">Memuat data pembayaran order...</p></div>
  </div>

  <!-- Section 2: Daftar Pembayaran Booster Creator -->
  <div id="sectionBoosters" style="display:none">
    <div id="boosterList"><p class="muted">Memuat data pembayaran booster...</p></div>
  </div>
</div>

<footer>
  Kreativa &copy; 2026 &bull; Platform Jasa Kreatif Digital
</footer>

<script src="/app.js"></script>
<script>
requireAuth('admin'); navbar();

let currentTab = 'orders';

function switchAdminTab(t) {
  currentTab = t;
  if (t === 'orders') {
    $('#tabOrders').className = 'tab on';
    $('#tabBoosters').className = 'tab';
    $('#sectionOrders').style.display = 'block';
    $('#sectionBoosters').style.display = 'none';
    loadPayments();
  } else {
    $('#tabOrders').className = 'tab';
    $('#tabBoosters').className = 'tab on';
    $('#sectionOrders').style.display = 'none';
    $('#sectionBoosters').style.display = 'block';
    loadBoosterPayments();
  }
}

async function init() {
  const qRes = await api('/api/qris');
  if(qRes.qris_image_url) {
    $('#qrisUrl').value = qRes.qris_image_url;
    $('#qrisUrlPrev').src = qRes.qris_image_url;
    $('#qrisUrlPrev').style.display = 'block';
  }
  loadPayments();
}

async function saveQris() {
  const url = $('#qrisUrl').value.trim();
  if(!url) throw new Error('Upload gambar QRIS terlebih dahulu.');
  await api('/api/admin/qris', {method:'POST', body:{qris_image_url: url}});
  alert('QRIS platform berhasil disimpan!');
}

// 1. ORDER PAYMENTS
async function loadPayments() {
  const list = await api('/api/admin/payments');
  $('#paymentList').innerHTML = list.length ? list.map(p => `
    <div class="form-card" style="margin:12px 0">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <b>Order #${p.id} &bull; ${esc(p.customer_name)} &rarr; ${esc(p.creator_name)}</b>
        ${payStatusBadge(p.payment_status)}
      </div>
      <p class="small muted" style="margin:0 0 12px">Total Pembayaran: <b style="color:var(--ink)">${rupiah(p.price_snapshot)}</b> &bull; Layanan: ${esc(p.service_title||'—')}</p>
      
      ${p.payment_proof_url ? `
        <div style="margin:12px 0;background:var(--border-light);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border)">
          <div class="small muted" style="margin-bottom:8px">Bukti Transfer Customer:</div>
          <a href="${esc(p.payment_proof_url)}" target="_blank" rel="noopener">
            <img src="${esc(p.payment_proof_url)}" style="max-width:240px;border:1px solid var(--border);border-radius:var(--radius-sm);display:block">
          </a>
        </div>
      ` : '<p class="small muted">Customer belum mengunggah bukti bayar.</p>'}

      ${p.payment_status === 'verifying' ? `
        <div class="row" style="gap:8px;margin-top:12px">
          <button class="btn small" onclick="guard(this,()=>verifyOrder(${p.id},'approve'))">Setujui Pembayaran (Lunas)</button>
          <button class="btn small ghost" onclick="guard(this,()=>verifyOrder(${p.id},'reject'))">Tolak Bukti Transfer</button>
        </div>
      ` : ''}
    </div>
  `).join('') : '<p class="muted">Belum ada transaksi pembayaran order.</p>';
}

async function verifyOrder(oid, action) {
  const isApprove = action === 'approve';
  const ok = await showConfirm({
    title: isApprove ? 'Setujui Pembayaran Order' : 'Tolak Bukti Pembayaran',
    message: isApprove 
      ? 'Apakah kamu yakin ingin menyetujui bukti pembayaran pesanan ini sebagai LUNAS?' 
      : 'Apakah kamu yakin ingin menolak bukti transfer ini?',
    confirmText: isApprove ? 'Setujui (Lunas)' : 'Tolak Pembayaran',
    cancelText: 'Batal',
    isDanger: !isApprove
  });
  if (!ok) return;

  await api(`/api/admin/orders/${oid}/verify-payment`, {method:'PATCH', body:{action}});
  showAlert(isApprove ? 'Pembayaran order disetujui (Lunas)!' : 'Bukti pembayaran order ditolak.');
  loadPayments();
}

// 2. BOOSTER PAYMENTS (SAAS)
async function loadBoosterPayments() {
  const list = await api('/api/admin/boosters');
  $('#boosterList').innerHTML = list.length ? list.map(b => {
    let stBadge = '';
    if (b.payment_status === 'verifying') {
      stBadge = '<span class="badge boost"><span class="badge-dot" style="background:currentColor"></span>Menunggu Verifikasi</span>';
    } else if (b.payment_status === 'rejected') {
      stBadge = '<span class="badge closed"><span class="badge-dot" style="background:currentColor"></span>Ditolak</span>';
    } else if (b.payment_status === 'paid') {
      stBadge = '<span class="badge open"><span class="badge-dot" style="background:currentColor"></span>Lunas (Booster Aktif)</span>';
    } else {
      stBadge = `<span class="badge plan">${esc(b.payment_status)}</span>`;
    }

    return `
    <div class="form-card" style="margin:12px 0">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <b>Booster #${b.id} &bull; ${esc(b.creator_name)} (${esc(b.creator_email)})</b>
        ${stBadge}
      </div>
      <p class="small muted" style="margin:0 0 12px">
        Paket: <b>${esc(b.plan_name)} (${b.duration_days} hari)</b> &bull; 
        Biaya: <b style="color:var(--ink)">${b.plan_price ? rupiah(b.plan_price) : '—'}</b> &bull; 
        Target: ${esc(b.service_title || 'Seluruh Toko')}
      </p>
      
      ${b.payment_proof_url ? `
        <div style="margin:12px 0;background:var(--border-light);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border)">
          <div class="small muted" style="margin-bottom:8px">Bukti Transfer QRIS Creator:</div>
          <a href="${esc(b.payment_proof_url)}" target="_blank" rel="noopener">
            <img src="${esc(b.payment_proof_url)}" style="max-width:240px;border:1px solid var(--border);border-radius:var(--radius-sm);display:block">
          </a>
        </div>
      ` : '<p class="small muted">Creator belum mengunggah bukti bayar.</p>'}

      ${b.payment_status === 'verifying' ? `
        <div class="row" style="gap:8px;margin-top:12px">
          <button class="btn small" onclick="guard(this,()=>verifyBooster(${b.id},'approve'))">Setujui & Aktifkan Booster</button>
          <button class="btn small ghost" onclick="guard(this,()=>verifyBooster(${b.id},'reject'))">Tolak Bukti Transfer</button>
        </div>
      ` : ''}
    </div>`;
  }).join('') : '<p class="muted">Belum ada transaksi pembelian booster.</p>';
}

async function verifyBooster(bid, action) {
  const isApprove = action === 'approve';
  const ok = await showConfirm({
    title: isApprove ? 'Aktifkan Layanan Booster' : 'Tolak Bukti Transfer',
    message: isApprove 
      ? 'Setujui pembayaran QRIS ini dan langsung aktifkan masa eksposur booster untuk creator?' 
      : 'Tolak bukti transfer pembelian booster ini?',
    confirmText: isApprove ? 'Setujui & Aktifkan' : 'Tolak Pembayaran',
    cancelText: 'Batal',
    isDanger: !isApprove
  });
  if (!ok) return;

  await api(`/api/admin/boosters/${bid}/verify-payment`, {method:'PATCH', body:{action}});
  showAlert(isApprove ? 'Pembayaran booster disetujui & booster telah diaktifkan!' : 'Pembayaran booster ditolak.');
  loadBoosterPayments();
}

init();
</script>
</body>
</html>
