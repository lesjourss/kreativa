<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin &mdash; Kreativa</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="/">Kreativa<span></span></a><div class="links" id="navLinks"></div></div></nav>
<div class="container" style="margin-top:24px;max-width:860px">
  <h2 style="font-size:22px;font-weight:700;margin-bottom:16px">Panel Admin &mdash; Verifikasi Pembayaran</h2>
  
  <!-- Form Set QRIS Admin -->
  <div class="form-card">
    <h3 style="margin:0 0 12px;font-size:16px">Pengaturan QRIS Pembayaran</h3>
    <label>Upload Gambar QRIS Platform</label>
    <div class="row">
      <input type="file" id="qrisFile" accept=".jpg,.jpeg,.png" style="flex:1" onchange="pickUpload('qrisFile','qrisUrl','qrisMsg')">
      <span class="small muted" id="qrisMsg"></span>
    </div>
    <input id="qrisUrl" placeholder="URL QRIS" style="margin-top:8px">
    <img id="qrisUrlPrev" class="prev" style="max-width:180px;display:none;margin-top:8px">
    <button class="btn small" style="margin-top:12px" onclick="guard(this,saveQris)">Simpan QRIS</button>
  </div>

  <!-- Daftar Pembayaran Customer -->
  <h3 style="margin:28px 0 12px;font-size:18px">Verifikasi Bukti Pembayaran</h3>
  <div id="paymentList"><p class="muted">Memuat data pembayaran...</p></div>
</div>

<script src="/app.js"></script>
<script>
requireAuth('admin'); navbar();

async function init() {
  const qRes = await api('/api/qris');
  if(qRes.qris_image_url) {
    $('#qrisUrl').value = qRes.qris_image_url;
    $('#qrisUrlPrev').src = qRes.qris_image_url;
    $('#qrisUrlPrev').style.display = 'block';
  }
  loadPayments();
}

async function saveQris() {
  const url = $('#qrisUrl').value.trim();
  if(!url) throw new Error('Upload gambar QRIS terlebih dahulu.');
  await api('/api/admin/qris', {method:'POST', body:{qris_image_url: url}});
  alert('QRIS Admin berhasil diperbarui!');
}

async function loadPayments() {
  const list = await api('/api/admin/payments');
  $('#paymentList').innerHTML = list.length ? list.map(p => `
    <div class="form-card" style="margin:12px 0">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <b>Order #${p.id} &bull; ${esc(p.customer_name)} &rarr; ${esc(p.creator_name)}</b>
        ${payStatusBadge(p.payment_status)}
      </div>
      <p class="small muted" style="margin:0 0 12px">Total Pembayaran: <b style="color:var(--ink)">${rupiah(p.price_snapshot)}</b></p>
      
      ${p.payment_proof_url ? `
        <div style="margin:12px 0;background:var(--border-light);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border)">
          <div class="small muted" style="margin-bottom:8px">Bukti Transfer Pelanggan:</div>
          <a href="${esc(p.payment_proof_url)}" target="_blank" rel="noopener">
            <img src="${esc(p.payment_proof_url)}" style="max-width:240px;border:1px solid var(--border);border-radius:var(--radius-sm);display:block">
          </a>
        </div>
      ` : '<p class="small muted">Customer belum mengunggah bukti bayar.</p>'}

      ${p.payment_status === 'verifying' ? `
        <div class="row" style="gap:8px;margin-top:12px">
          <button class="btn small" onclick="guard(this,()=>verify(${p.id},'approve'))">Setujui Pembayaran (Lunas)</button>
          <button class="btn small ghost" onclick="guard(this,()=>verify(${p.id},'reject'))">Tolak Bukti Transfer</button>
        </div>
      ` : ''}
    </div>
  `).join('') : '<p class="muted">Belum ada transaksi pembayaran.</p>';
}

async function verify(oid, action) {
  await api(`/api/admin/orders/${oid}/verify-payment`, {method:'PATCH', body:{action}});
  loadPayments();
}

init();
</script>
</body>
</html>
