<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Store Creator — Kreativa</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="/">Kreativa<span></span></a><div class="links" id="navLinks"></div></div></nav>
<div class="container" id="wrap" style="margin-top:24px"><p class="muted">Memuat toko...</p></div>

<footer>
  Kreativa &copy; 2026 &bull; Platform Jasa Kreatif Digital
</footer>

<script src="/app.js"></script>
<script>
navbar();
const params = new URLSearchParams(location.search);
async function init(){
  let creatorId = params.get('creator'), serviceId = params.get('service');
  let data;
  if(serviceId){
    const s = await api('/api/services/'+serviceId);
    creatorId = s.creator_id;
    data = await api('/api/creators/'+creatorId+'/store');
    render(data, s.id);
  } else if(creatorId){
    data = await api('/api/creators/'+creatorId+'/store');
    render(data, null);
  } else { $('#wrap').innerHTML='<p class="muted">Toko tidak ditemukan.</p>'; }
}
function render(data, highlightService){
  const {creator, profile, services, portfolios, reviews} = data;
  const open = (profile?.availability_status||'open')==='open';
  $('#wrap').innerHTML = `
    <div class="form-card" style="margin-bottom:24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap">
      <img src="${esc(profile?.avatar_url||creator.avatar_url||'https://i.pravatar.cc/100?u='+creator.id)}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--border)">
      <div>
        <div class="row" style="gap:10px;margin-bottom:4px">
          <h2 style="margin:0;font-size:22px;font-weight:700">${esc(creator.name)}</h2>
          <span class="badge ${open?'open':'closed'}"><span class="badge-dot" style="background:currentColor"></span>${open?'Open for Order':'Closed'}</span>
        </div>
        <div class="small muted">Rating ${profile?.avg_rating||0} (${profile?.total_reviews||0} ulasan) &bull; ${services.length} layanan aktif</div>
        <p class="small" style="margin:8px 0 0;line-height:1.5;color:#334155">${esc(profile?.bio||'Belum ada bio toko.')}</p>
      </div>
    </div>

    <h3 style="margin:28px 0 14px;font-size:18px">Layanan Kreatif (${services.length})</h3>
    <div class="grid cards">${services.map(s=>`
      <div class="card" ${s.id==highlightService?'style="outline:2px solid var(--brand)"':''}>
        <img class="thumb" src="${esc(s.thumbnail_url||'https://picsum.photos/seed/'+s.id+'/600/400')}" onerror="this.onerror=null;this.src='https://picsum.photos/seed/kreativa-${s.id}/600/400'" alt="${esc(s.title)}">
        <div class="card-body">
          <div class="row" style="margin-bottom:8px">
            <span class="badge plan">${esc(s.category_name||'-')}</span>
            ${s.is_boosted?'<span class="badge boost">Promoted</span>':''}
          </div>
          <h4 style="margin:0 0 6px;font-size:16px">${esc(s.title)}</h4>
          <p class="small muted" style="margin:0 0 14px;line-height:1.5">${esc(s.description||'').slice(0,120)}</p>
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px">PILIHAN PAKET</div>
          ${s.packages.map(p=>`
            <div class="form-card" style="margin:6px 0;padding:12px;background:var(--border-light);border:1px solid var(--border)">
              <div class="row" style="justify-content:space-between;margin-bottom:4px">
                <b>${esc(p.name)}</b>
                <span style="font-weight:700">${rupiah(p.price)}</span>
              </div>
              <div class="small muted" style="margin-bottom:8px">${p.estimated_days} hari pengerjaan &bull; ${p.revision_count}x revisi</div>
              <button class="btn small" style="width:100%" onclick="order(${p.id},${open})">Pesan Paket Ini</button>
            </div>`).join('')||'<p class="small muted">Belum ada paket aktif.</p>'}
        </div>
      </div>`).join('')||'<p class="muted">Belum ada layanan tersedia.</p>'}
    </div>

    <h3 style="margin:36px 0 14px;font-size:18px">Portofolio Karya (${portfolios.length})</h3>
    <div class="grid cards">${portfolios.map(p=>`
      <div class="card"><img class="thumb" src="${esc(p.image_url)}" onerror="this.onerror=null;this.src='https://picsum.photos/seed/kreativa/600/400'" alt="${esc(p.title)}"><div class="card-body"><b>${esc(p.title)}</b><p class="small muted" style="margin:4px 0 0">${esc(p.description||'')}</p></div></div>`).join('')||'<p class="muted">Belum ada portofolio diunggah.</p>'}
    </div>

    <h3 style="margin:36px 0 14px;font-size:18px">Ulasan Pelanggan (${reviews.length})</h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">
    ${reviews.map(r=>`<div class="form-card" style="margin:0"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span> <b class="small">${esc(r.customer_name)}</b></div><p class="small" style="margin:0;color:#334155">${esc(r.comment)}</p></div>`).join('')||'<p class="muted">Belum ada ulasan untuk kreator ini.</p>'}
    </div>
  `;
}
function order(packageId, open){
  if(!open){ alert('Creator saat ini sedang menutup penerimaan pesanan (Closed).'); return; }
  const u=currentUser();
  if(!u){ location.href='/auth.html'; return; }
  if(u.role!=='customer'){ alert('Akun creator tidak dapat memesan jasa. Silakan gunakan akun customer.'); return; }
  location.href='/order.html?package='+packageId;
}
init();
</script>
</body>
</html>
