<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cari Creator — Kreativa</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="/">Kreativa<span></span></a><div class="links" id="navLinks"></div></div></nav>
<div class="container" style="margin-top:24px">
  <h2 style="font-size:22px;font-weight:700;margin-bottom:16px">Cari Creator</h2>
  <div class="form-card" style="margin-bottom:20px">
    <div class="row" style="gap:10px;flex-wrap:wrap">
      <input id="q" placeholder="Nama, keahlian, atau jenis layanan..." oninput="debounce()" style="flex:2;min-width:200px">
      <select id="cat" onchange="load()" style="flex:1;min-width:150px"><option value="">Semua kategori</option></select>
      <select id="sort" onchange="load()" style="flex:1;min-width:150px">
        <option value="boosted">Rekomendasi (Promoted)</option>
        <option value="rating">Rating tertinggi</option>
        <option value="popular">Review terbanyak</option>
        <option value="newest">Creator terbaru</option>
        <option value="price_low">Harga mulai termurah</option>
        <option value="name">Nama A-Z</option>
      </select>
      <label class="chk"><input type="checkbox" id="openOnly" onchange="load()"> Open order saja</label>
    </div>
  </div>
  <p class="small muted" id="count" style="margin-bottom:16px"></p>
  <div class="grid cards" id="list"></div>
</div>

<footer>
  Kreativa &copy; 2026 &bull; Platform Jasa Kreatif Digital
</footer>

<script src="/app.js"></script>
<script>
navbar(); let tm, seq=0;
function debounce(){ clearTimeout(tm); tm=setTimeout(load,350); }
async function init(){ (await api('/api/categories').catch(()=>[])).forEach(c=>{const o=document.createElement('option');o.value=c.name;o.textContent=c.name;$('#cat').appendChild(o);}); load(); }
async function load(){
  const my=++seq, p=new URLSearchParams({search:$('#q').value.trim(),category:$('#cat').value,sort:$('#sort').value,open_only:$('#openOnly').checked?'1':''});
  const items=await api('/api/creators?'+p).catch(e=>{$('#list').innerHTML='<p>'+esc(e.message)+'</p>';return null;});
  if(my!==seq||!items) return;
  $('#count').textContent=items.length+' creator ditemukan';
  $('#list').innerHTML=items.length?items.map(c=>`<div class="card"><div class="card-body">
    <div class="row" style="gap:12px"><img class="avatar" src="${esc(c.avatar_url||'https://i.pravatar.cc/100?u='+c.id)}" alt="${esc(c.name)}"><div><h3 style="margin:0;font-size:16px"><a href="/store.html?creator=${c.id}">${esc(c.name)}</a></h3>
    <div class="small muted">Rating ${c.avg_rating||0} (${c.total_reviews||0} ulasan) &bull; ${c.service_count} layanan</div></div></div>
    <div class="row" style="margin:10px 0 8px;gap:6px">
      ${c.is_boosted?'<span class="badge boost">Promoted</span>':''}
      <span class="badge ${c.availability_status==='closed'?'closed':'open'}"><span class="badge-dot" style="background:currentColor"></span>${c.availability_status==='closed'?'Closed':'Open'}</span>
      ${c.categories.slice(0,2).map(k=>`<span class="badge plan">${esc(k)}</span>`).join('')}
    </div>
    <p class="small muted" style="margin:0 0 14px;line-height:1.5">${esc(c.bio||'Belum ada bio toko.')}</p>
    <div class="row" style="justify-content:space-between;margin-top:auto;padding-top:10px;border-top:1px solid var(--border)">
      <div>
        <div class="small muted" style="font-size:11px">Mulai dari</div>
        <b>${c.price_from!=null?rupiah(c.price_from):'—'}</b>
      </div>
      <a class="btn small ghost" href="/store.html?creator=${c.id}">Lihat Toko</a>
    </div></div></div>`).join(''):'<p class="muted">Tidak ada creator yang cocok.</p>';
}
init();
</script>
</body>
</html>
